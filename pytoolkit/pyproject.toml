[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytoolkit-package"
dynamic = ["version"]
description = "Shared helpers for Kestra tasks — SQL Server, CDC, Parquet, storage, and API clients"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["requests"]
cdc = ["pymssql"]
parquet = ["pyarrow"]
sqlserver = ["pyodbc"]
all = ["pytoolkit-package[api,cdc,parquet,sqlserver]"]

[tool.hatch.version]
path = "src/python_toolkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/python_toolkit"]
